name: mdlm
diffusion_type: absorbing
backbone: dit
parameterization: subs
time_conditioning: False
T: 0  # 0 (continuous time) / 1000 
causal_attention: False
loss_type: elbo  # elbo, low_var

post_process_mode: log_probs  # log_probs / logits (sampling-only for logits)
adaLN: True
num_modes: 1  # > 1: multi-mode denoiser, M predictions and a sequence-level mode head (see modes.py)
hyp_loss: mixture  # num_modes > 1: mixture / wta / tempered
loss_weighting: none  # cross-entropy losses (num_modes > 1, unsid): none (all noise levels equal) / elbo (-alpha'_t / (1 - alpha_t), 1/t for log-linear)
