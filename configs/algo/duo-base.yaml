name: duo_base
diffusion_type: uniform
backbone: dit  # dit / dimamba / hf_dit
parameterization: mean
time_conditioning: True
T: 0  # 0 (continuous time) / 1000 
subs_masking: False
causal_attention: False
loss_type: elbo  # elbo, low_var
adaLN: True
num_modes: 1  # > 1: multi-mode denoiser, M predictions and a sequence-level mode head (see modes.py)
hyp_loss: mixture  # num_modes > 1: mixture / wta / tempered
loss_weighting: elbo  # elbo (DUO ELBO) / none (cross-entropy of x0); with num_modes > 1, of each mode
