# Ancestral sampler (posterior sampling for MDLM / DUO)
predictor: ancestral
ancestral_noise:         # schedule of the ancestral steps (null: the model schedule, noise)
  type: log-linear       # log-linear / cosine
  power: 2               # cosine only: alpha_t = cos(pi/2 t)^power
steps: 1024
steps_policy: full      # full: use steps as-is / proportional: steps * num_tokens_to_generate
noise_removal: ancestral  # ancestral / greedy
x0_param: elbo           # uniform diffusion: elbo (DUO, loss_weighting=elbo) / posterior (p(x0 | xt), loss_weighting=none)
use_float64: true
p_nucleus: 1.0
temperature: 1.0
num_sample_batches: 2
num_sample_log: 2
hyp_selection: sample   # algo.num_modes > 1: sample one mode per sequence at each step / average the mixture
