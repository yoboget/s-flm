# Ancestral denoising in a proportion lam of the steps, then noised again to the noise level alpha = lam and denoised with sid in the remaining steps (MDLM / DUO)
predictor: ancestral_restart
lam: 0.75              # proportion of the steps of the ancestral pass and restart noise level alpha (any schedule; log-linear: t = 1 - lam) (1: ancestral, 0: sid)
restart_sampler: sid    # kernel after the restart: sid / ancestral (second ancestral pass from the restart time, to ablate the sid refinement)
ancestral_noise:         # schedule of the ancestral steps (null: the model schedule, noise)
  type: log-linear       # log-linear / cosine
  power: 2               # cosine only: alpha_t = cos(pi/2 t)^power
sid_noise:               # schedule of the sid steps (null: the model schedule, noise)
  type: cosine           # log-linear / cosine
  power: 0.5             # cosine only: alpha_t = cos(pi/2 t)^power
steps: 1024
steps_policy: full      # full: use steps as-is / proportional: steps * num_tokens_to_generate
noise_removal: ancestral  # ancestral (sample) / greedy (argmax) at the final step
sid_x0_param: posterior  # sid steps, uniform diffusion: posterior (use the output as p(x0 | xt)) / elbo (DUO x_theta, converted to p(x0 | xt))
x0_param: elbo           # uniform diffusion: elbo (DUO, loss_weighting=elbo) / posterior (p(x0 | xt), loss_weighting=none)
use_float64: true
p_nucleus: 1.0
temperature: 1.0
hyp_selection: sample   # algo.num_modes > 1: sample one mode per sequence at each step / average the mixture
num_sample_batches: 2
num_sample_log: 2
